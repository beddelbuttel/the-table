<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="The Table">
<meta name="theme-color" content="#faf8f5">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<title>The Table — Eddelbuttel Nutrition</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Jost:wght@300;400;500&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --sage:#8a9e7e;--sage-l:#eef3eb;--sage-d:#5a6e50;
  --warm:#7a7370;--warm-l:#f5f3f0;--warm-d:#4a4442;
  --cream:#faf8f5;--bdr:#e8e4df;
  --red:#e24b4a;--red-l:#fff0f0;--red-d:#791f1f;
  --blue:#378add;--blue-l:#e6f1fb;--blue-d:#0c447c;
  --amber:#ef9f27;--amber-l:#faeeda;--amber-d:#633806;
  --gold:#a07830;--gold-l:#fdf6e8;
}
body{font-family:'Jost',sans-serif;background:var(--cream);color:var(--warm-d);font-size:14px;height:100vh;overflow:hidden;-webkit-text-size-adjust:100%;-webkit-overflow-scrolling:touch;overscroll-behavior:none;touch-action:pan-x pan-y;position:fixed;width:100%;}
.serif{font-family:'Cormorant Garamond',Georgia,serif}
.hidden{display:none !important}

/* ── LOGIN ── */
.login-wrap{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;padding:2rem;background:var(--cream);overflow-y:auto;-webkit-overflow-scrolling:touch;}
.brand{font-family:'Cormorant Garamond',serif;font-size:36px;font-weight:400;color:var(--warm);text-align:center}
.sub{font-size:11px;letter-spacing:.18em;color:var(--sage);margin-top:6px;text-transform:uppercase;text-align:center}
.login-card{background:#fff;border:0.5px solid var(--bdr);border-radius:14px;padding:2rem;width:100%;max-width:390px;margin-top:1.5rem}
.login-card h2{font-family:'Cormorant Garamond',serif;font-size:22px;font-weight:400;margin-bottom:4px}
.login-card p{font-size:13px;color:var(--warm);margin-bottom:1.25rem}
.fg{margin-bottom:1rem}
.fg label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm);margin-bottom:5px}
.fg input,.fg select,.fg textarea{width:100%;padding:10px 12px;border:0.5px solid var(--bdr);border-radius:8px;font-family:'Jost',sans-serif;font-size:14px;background:#fff;color:var(--warm-d);-webkit-appearance:none;appearance:none}
.fg input:focus,.fg select:focus,.fg textarea:focus{outline:none;border-color:var(--sage)}
.btn-primary{width:100%;padding:11px;background:var(--warm-d);color:#fff;border:none;border-radius:8px;font-family:'Jost',sans-serif;font-size:14px;cursor:pointer}
.btn-primary:hover{background:var(--warm)}
.lerr{background:var(--red-l);border:0.5px solid var(--red);color:var(--red-d);padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:1rem}

/* ── APP SHELL ── */
#app{display:none;flex-direction:column;height:100vh;overflow:hidden;position:fixed;width:100%;top:0;left:0;}
#app.visible{display:flex}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:10px 18px;padding-top:calc(10px + env(safe-area-inset-top));background:#fff;border-bottom:0.5px solid var(--bdr);flex-shrink:0}
.topbar-brand{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--warm)}
.topbar-brand em{font-style:normal;color:var(--sage);font-size:11px;font-family:'Jost',sans-serif;margin-left:10px;letter-spacing:.1em;text-transform:uppercase}
.avbtn{width:32px;height:32px;border-radius:50%;background:var(--sage-l);border:none;cursor:pointer;font-size:13px;font-weight:500;color:var(--sage-d);font-family:'Jost',sans-serif}
.navbar{display:flex;background:#fff;border-bottom:0.5px solid var(--bdr);padding:0 18px;overflow-x:auto;flex-shrink:0;-webkit-overflow-scrolling:touch}
.nbtn2{padding:10px 14px;font-size:12px;color:var(--warm);cursor:pointer;border-bottom:2px solid transparent;background:none;border-top:none;border-left:none;border-right:none;font-family:'Jost',sans-serif;white-space:nowrap;display:flex;align-items:center;gap:5px}
.nbtn2:hover{color:var(--warm-d)}
.nbtn2.active{color:var(--sage-d);border-bottom-color:var(--sage)}
.pages{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;}
.page{display:none;padding:1.25rem 1.5rem;padding-bottom:calc(1.25rem + env(safe-area-inset-bottom));}
.page.active{display:block}

/* ── COMPONENTS ── */
.card{background:#fff;border:0.5px solid var(--bdr);border-radius:10px;padding:1rem 1.25rem;margin-bottom:1rem}
.card-title{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--warm);margin-bottom:10px}
.g2{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:1rem}
.g2>*{flex:1 1 140px}
.g3{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:1rem}
.g3>*{flex:1 1 100px}
.fi label{display:block;font-size:12px;color:var(--warm);margin-bottom:4px}
.fi input,.fi select,.fi textarea{width:100%;padding:7px 10px;border:0.5px solid var(--bdr);border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;background:#fff;color:var(--warm-d);-webkit-appearance:none;appearance:none}
.fi textarea{resize:vertical;min-height:60px}
.fi input:focus,.fi select:focus,.fi textarea:focus{outline:none;border-color:var(--sage)}
.btn{padding:7px 14px;border:0.5px solid var(--bdr);border-radius:7px;background:#fff;font-family:'Jost',sans-serif;font-size:12px;cursor:pointer;color:var(--warm-d);display:inline-flex;align-items:center;gap:5px;-webkit-appearance:none}
.btn:hover{background:var(--warm-l)}
.bs{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d)}.bs:hover{background:#dde9d8}
.bd{background:var(--warm-d);color:#fff;border-color:var(--warm-d)}.bd:hover{background:var(--warm)}
.bb{background:var(--blue-l);border-color:var(--blue);color:var(--blue-d)}
.br{background:var(--red-l);border-color:var(--red);color:var(--red-d)}
.ba{background:var(--amber-l);border-color:var(--amber);color:var(--amber-d)}
.bg{background:var(--gold-l);border-color:var(--gold);color:var(--gold)}
.bfull{width:100%;justify-content:center;padding:10px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;margin:2px;background:var(--warm-l);color:var(--warm-d)}
.tg{background:var(--sage-l);color:var(--sage-d)}
.tr2{background:var(--red-l);color:var(--red-d);border:0.5px solid var(--red)}
.ta{background:var(--amber-l);color:var(--amber-d)}
.empty{text-align:center;padding:2.5rem;color:var(--warm);font-size:13px}
.divider{border:none;border-top:0.5px solid var(--bdr);margin:1rem 0}

/* ── CLIENT CARD ── */
.client-card{background:#fff;border:0.5px solid var(--bdr);border-radius:10px;padding:1rem 1.25rem;margin-bottom:.75rem;cursor:pointer;transition:border-color .15s}
.client-card:hover{border-color:var(--sage)}
.cc-name{font-size:16px;font-weight:500;margin-bottom:3px}
.cc-sub{font-size:12px;color:var(--warm)}
.allergy-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:500;background:var(--red-l);color:var(--red-d);border:0.5px solid var(--red);margin-top:6px;margin-right:4px}
.diet-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:99px;font-size:11px;background:var(--sage-l);color:var(--sage-d);margin-top:6px;margin-right:4px}

/* ── PROFILE TABS ── */
.tab-bar{display:flex;gap:4px;margin-bottom:1rem;flex-wrap:wrap}
.tab-btn{padding:6px 14px;border:0.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:'Jost',sans-serif;font-size:12px;cursor:pointer;color:var(--warm);-webkit-appearance:none}
.tab-btn.active{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d);font-weight:500}

/* ── FEEDBACK ── */
.star-row{display:flex;gap:6px;margin:6px 0}
.star-btn{background:none;border:none;cursor:pointer;font-size:22px;padding:0;color:#ddd;line-height:1}
.star-btn.on{color:#ef9f27}
.meal-fb-row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--bdr);flex-wrap:wrap}
.meal-fb-name{flex:1;min-width:120px;font-size:13px;font-weight:500}
.thumb-btn{background:none;border:0.5px solid var(--bdr);border-radius:6px;padding:5px 10px;cursor:pointer;font-size:14px;color:var(--warm)}
.thumb-btn.up{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d)}
.thumb-btn.down{background:var(--red-l);border-color:var(--red);color:var(--red-d)}
.fb-hist-item{padding:10px 0;border-bottom:0.5px solid var(--bdr)}
.fb-hist-item:last-child{border-bottom:none}
.fb-week{font-size:11px;color:var(--warm);margin-bottom:4px}
.fb-rating{font-size:13px;font-weight:500;margin-bottom:4px}
.fb-note{font-size:13px;color:var(--warm-d);margin-bottom:6px;font-style:italic}
.fb-meals{display:flex;flex-wrap:wrap;gap:4px}

/* ── AI ── */
.ai-ctx{background:var(--sage-l);border-radius:8px;padding:10px 12px;font-size:12px;color:var(--sage-d);margin-bottom:10px;line-height:1.6}
.aichat{max-height:380px;overflow-y:auto;margin-bottom:10px;display:flex;flex-direction:column;gap:8px}
.aim{padding:10px 13px;border-radius:10px;font-size:13px;line-height:1.6;max-width:92%}
.aim.user{background:var(--warm-d);color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.aim.ai{background:#fff;border:0.5px solid var(--bdr);align-self:flex-start;border-bottom-left-radius:3px}
.aim.ai.intro{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d)}
.aim.flag{background:var(--red-l);border:0.5px solid var(--red);align-self:flex-start}
.aim.thinking{background:var(--warm-l);color:var(--warm);align-self:flex-start;font-style:italic}
.aiinput{display:flex;gap:8px;align-items:flex-end}
.aiinput textarea{flex:1;padding:9px 12px;border:0.5px solid var(--bdr);border-radius:8px;font-family:'Jost',sans-serif;font-size:13px;resize:none;background:#fff;color:var(--warm-d)}
.aiinput textarea:focus{outline:none;border-color:var(--sage)}
.qpb{padding:6px 12px;border:0.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;color:var(--warm);white-space:nowrap}
.qpb:hover{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d)}

/* ── RECIPES ── */
.rec-tag{padding:4px 10px;border:0.5px solid var(--bdr);border-radius:99px;background:#fff;font-family:'Jost',sans-serif;font-size:11px;cursor:pointer;color:var(--warm);margin:2px}
.rec-tag.on{background:var(--sage-l);border-color:var(--sage);color:var(--sage-d)}

/* ── MODAL ── */
.mov{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:999;padding:1rem}
.mov.open{display:flex}
.mbox{background:#fff;border-radius:14px;padding:1.5rem;width:100%;max-width:480px;max-height:82vh;overflow-y:auto}
.mbox h3{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:400;margin-bottom:1rem}
.mlink{display:block;text-align:center;font-size:13px;color:var(--warm);margin-top:1rem;cursor:pointer;background:none;border:none;font-family:'Jost',sans-serif;width:100%}

/* ── FEEDBACK FORM PAGE (public) ── */
.fb-form-wrap{max-width:480px;margin:0 auto;padding:2rem 1.25rem}
.fb-form-header{text-align:center;margin-bottom:2rem}

/* ── WEEK PLAN ── */
.week-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-bottom:1rem}
.day-col{background:#fff;border:0.5px solid var(--bdr);border-radius:8px;padding:8px 10px;min-height:80px}
.day-label{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--warm);margin-bottom:6px;font-weight:500}
.meal-chip{background:var(--sage-l);border-radius:5px;padding:4px 7px;font-size:11px;color:var(--sage-d);margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;gap:4px;cursor:pointer}
.meal-chip:hover{background:#dde9d8}
.meal-chip-del{background:none;border:none;cursor:pointer;color:var(--sage-d);font-size:13px;padding:0;line-height:1;flex-shrink:0}
.add-meal-btn{font-size:10px;color:var(--warm);cursor:pointer;background:none;border:none;padding:2px 0;font-family:'Jost',sans-serif;display:flex;align-items:center;gap:3px}
.add-meal-btn:hover{color:var(--sage-d)}

/* ── SEND LINK COPY ── */
.copy-link-box{display:flex;gap:6px;margin-top:8px}
.copy-link-box input{flex:1;padding:8px 10px;border:0.5px solid var(--bdr);border-radius:7px;font-size:12px;font-family:'Jost',sans-serif;background:var(--warm-l);color:var(--warm-d)}
</style>
</head>
<body>

<!-- ── LOGIN ─────────────────────────────────────────────────────────────── -->
<div id="vlogin" class="login-wrap">
  <div class="brand serif">The Table</div>
  <div class="sub">Eddelbuttel Nutrition</div>
  <div class="login-card">
    <h2>Sign in</h2>
    <p>Enter your details to continue.</p>
    <div id="lerr" class="lerr hidden">Incorrect email or password.</div>
    <div class="fg"><label>Email</label><input id="lemail" type="email" autocomplete="email"></div>
    <div class="fg"><label>Password</label><input id="lpw" type="password" autocomplete="current-password"></div>
    <button class="btn-primary" onclick="doLogin()">Sign in</button>
  </div>
</div>

<!-- ── APP ───────────────────────────────────────────────────────────────── -->
<div id="app">
  <div class="topbar">
    <div class="topbar-brand serif">The Table <em id="role-badge"></em></div>
    <button class="avbtn" id="avbtn" onclick="signOut()"></button>
  </div>
  <div class="navbar" id="navbar"></div>
  <div class="pages">
    <div id="p-clients" class="page"></div>
    <div id="p-ai" class="page"></div>
    <div id="p-recipes" class="page"></div>
    <div id="p-feedback" class="page"></div>
    <div id="p-team" class="page"></div>
  </div>
</div>

<!-- ── MODAL ─────────────────────────────────────────────────────────────── -->
<div class="mov" id="mov"><div class="mbox" id="mbox"></div></div>

<script>
// -- CONSTANTS ----------------------------------------------------------------
var WDAYS = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
var MTYPES = ['Dinner','Breakfast','Lunch','Snack'];
var DIET_TAGS = ['Vegan','Vegetarian','Pescatarian','Gluten-free','Dairy-free','Nut-free','Egg-free','Kid-friendly'];
var CCOLORS = ['#c0dd97','#9FE1CB','#B5D4F4','#FAC775','#AFA9EC'];

// -- NAV CONFIG -- 4 sections only ---------------------------------------------
var NAVCFG = {
  dietitian: ['clients','ai','recipes','feedback','team'],
  chef:      ['clients','ai','recipes','feedback'],
  manager:   ['clients','feedback','team']
};
var NAVLBL = {clients:'Clients',ai:'AI Assistant',recipes:'Recipes',feedback:'Feedback',team:'Team'};
var NAVICO = {clients:'ti-users',ai:'ti-robot',recipes:'ti-book',feedback:'ti-star',team:'ti-settings'};

// -- STATE --------------------------------------------------------------------
var S = {
  role:'chef', uid:'u2', page:'clients', wsCid:0,
  clientTab:'profile', aiH:{}, recEdit:null,
  recFilter:'All', recTagFilter:[]
};

// -- TEAM ---------------------------------------------------------------------
var TEAM = [
  {id:'u1',name:'Brittany Eddelbuttel',role:'dietitian',email:'brittany@eddelbuttel.com',password:'diet123',color:'#B5D4F4'},
  {id:'u2',name:'Brandy Barnes',role:'chef',email:'brandyrbarnes0@gmail.com',password:'chef123',color:'#c0dd97'},
  {id:'u3',name:'Riley Mills',role:'chef',email:'millsriley2020@gmail.com',password:'chef123',color:'#9FE1CB'},
  {id:'u4',name:'Esther Brown',role:'chef',email:'estherbrow22@gmail.com',password:'chef123',color:'#AFA9EC'},
  {id:'u5',name:'Brenda',role:'manager',email:'brenda@eddelbuttel.com',password:'mgr123',color:'#FAC775'}
];
var CLIENTS = [];
var RECIPES = [];

// -- SUPABASE CONFIG ----------------------------------------------------------
var SUPA_URL = 'https://ohjzxjlrfnnwzplhtzzc.supabase.co';
var SUPA_KEY = 'sb_publishable_SPpu-Ts7xmsKzJx-vkg0vg_ATZNjKCn';

function supaGet(id, cb) {
  fetch(SUPA_URL+'/rest/v1/thetable_data?id=eq.'+id+'&select=data', {
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY}
  }).then(function(r){return r.json();})
  .then(function(rows){cb(rows&&rows.length?rows[0].data:null);})
  .catch(function(){cb(null);});
}

function supaSet(id, data) {
  fetch(SUPA_URL+'/rest/v1/thetable_data?id=eq.'+id, {
    method:'PATCH',
    headers:{'apikey':SUPA_KEY,'Authorization':'Bearer '+SUPA_KEY,'Content-Type':'application/json','Prefer':'return=minimal'},
    body:JSON.stringify({data:data,updated_at:new Date().toISOString()})
  }).catch(function(){});
}

// -- PERSISTENCE --------------------------------------------------------------
var _saveTimer = null;
function saveData() {
  try { localStorage.setItem('thetable_v2', JSON.stringify({CLIENTS:CLIENTS,TEAM:TEAM,RECIPES:RECIPES,AI_HISTORY:S.aiH})); } catch(e) {}
  if (_saveTimer) clearTimeout(_saveTimer);
  _saveTimer = setTimeout(function() {
    supaSet('clients', CLIENTS);
    supaSet('team', TEAM);
    supaSet('recipes', RECIPES);
    supaSet('ai_history', S.aiH);
  }, 800);
}

var _dataLoaded = false;
function loadData() {
  try {
    var raw = localStorage.getItem('thetable_v2');
    if (raw) {
      var d = JSON.parse(raw);
      if (d.CLIENTS && d.CLIENTS.length) CLIENTS = d.CLIENTS;
      if (d.TEAM && d.TEAM.length) TEAM = d.TEAM;
      if (d.RECIPES) RECIPES = d.RECIPES;
      if (d.AI_HISTORY) S.aiH = d.AI_HISTORY;
    }
  } catch(e) {}
  var loaded = 0;
  function check() {
    loaded++;
    if (loaded >= 4 && !_dataLoaded) {
      _dataLoaded = true;
      var fns = {clients:rClients,ai:rAI,recipes:rRec,feedback:rFeedback,team:rTeam};
      if (S.page && fns[S.page]) fns[S.page]();
    }
  }
  supaGet('clients', function(d) {
    if (d && Array.isArray(d) && d.length) CLIENTS = d;
    check();
  });
  supaGet('team', function(d) {
    if (d && Array.isArray(d) && d.length) TEAM = d;
    check();
  });
  supaGet('recipes', function(d) {
    if (d && Array.isArray(d)) RECIPES = d;
    check();
  });
  supaGet('ai_history', function(d) {
    if (d && typeof d === 'object' && !Array.isArray(d)) S.aiH = d;
    check();
  });
}
loadData();

// -- HELPERS ------------------------------------------------------------------
function $(id) { return document.getElementById(id); }
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function tod() { return new Date().toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function tu(id) { for(var i=0;i<TEAM.length;i++){if(TEAM[i].id===id)return TEAM[i];} return null; }
function gc(id) { for(var i=0;i<CLIENTS.length;i++){if(CLIENTS[i].id===id)return CLIENTS[i];} return null; }
function myC() {
  if(S.role==='dietitian'||S.role==='manager') return CLIENTS;
  var out=[];
  for(var i=0;i<CLIENTS.length;i++){if(CLIENTS[i].chefId===S.uid)out.push(CLIENTS[i]);}
  return out;
}
function stars(n) {
  var s=''; for(var i=1;i<=5;i++) s+=(i<=n?'*':'o'); return s;
}
function mtb(t) {
  var c={Dinner:'tg',Breakfast:'tb',Lunch:'ta',Snack:''};
  return '<span class="tag '+(c[t]||'')+'">'+esc(t)+'</span>';
}

// -- LOGIN --------------------------------------------------------------------
function doLogin() {
  var e=$('lemail').value.trim().toLowerCase();
  var p=$('lpw').value;
  for(var i=0;i<TEAM.length;i++){
    if(TEAM[i].email===e && TEAM[i].password===p){
      var u=TEAM[i];
      S.uid=u.id; S.role=u.role;
      $('vlogin').classList.add('hidden');
      $('app').classList.add('visible');
      $('role-badge').textContent=u.role==='dietitian'?'Brittany':u.role==='manager'?'Brenda':u.name.split(' ')[0];
      $('avbtn').textContent=u.name.charAt(0);
      buildNav();
      go('clients');
      return;
    }
  }
  $('lerr').classList.remove('hidden');
}
function signOut(){
  $('app').classList.remove('visible');
  $('vlogin').classList.remove('hidden');
  $('lemail').value='';$('lpw').value='';
  $('lerr').classList.add('hidden');
}

function buildNav() {

function go(name) {
  S.page=name;
  var all=document.querySelectorAll('.page');
  for(var i=0;i<all.length;i++)all[i].classList.remove('active');
  var el=$('p-'+name); if(el)el.classList.add('active');
  var btns=document.querySelectorAll('.nbtn2');
  for(var i=0;i<btns.length;i++){
    btns[i].classList.toggle('active', btns[i].id==='nb-'+name);

  var fns={clients:rClients,ai:rAI,recipes:rRec,feedback:rFeedback,team:rTeam};

// -- CLIENTS PAGE -------------------------------------------------------------
function rClients() {
  var cl = myC();
  var html = '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">' +
    '<h2 class="serif" style="font-size:22px;font-weight:400">Clients</h2>' +
    (S.role==='dietitian'?'<button class="btn bs" onclick="addClientM()"><i class="ti ti-plus" style="font-size:13px"></i> Add client</button>':'') +
  '</div>';
  if (!cl.length) {
    html += '<div class="empty">No clients yet.' + (S.role==='dietitian'?' Add the first one above.':'') + '</div>';
  } else {
    for(var i=0;i<cl.length;i++){
      var c=cl[i];
      var lf = c.feedbackHistory && c.feedbackHistory.length ? c.feedbackHistory[0] : null;
      var chef = tu(c.chefId);
      var badges='';
      if(c.allergies && c.allergies.length){
        for(var j=0;j<c.allergies.length;j++) badges+='<span class="allergy-badge"><i class="ti ti-alert-triangle" style="font-size:10px"></i>'+esc(c.allergies[j])+'</span>';
      }
      if(c.dietaryRestrictions && c.dietaryRestrictions.length){
        for(var j=0;j<c.dietaryRestrictions.length;j++) badges+='<span class="diet-badge">'+esc(c.dietaryRestrictions[j])+'</span>';
      }
      html += '<div class="client-card" onclick="openClient('+c.id+')">' +
        '<div style="display:flex;justify-content:space-between;align-items:flex-start">' +
          '<div>' +
            '<div class="cc-name">'+esc(c.name)+'</div>' +
            '<div class="cc-sub">' + (chef?'Chef: '+chef.name.split(' ')[0]:'Unassigned') + (c.serviceDay?' . '+c.serviceDay+'s':'') + '</div>' +
          '</div>' +
          (lf?'<span class="tag ta" style="flex-shrink:0">* '+lf.overallRating+'/5 last week</span>':'<span class="tag" style="flex-shrink:0">No feedback yet</span>') +
        '</div>' +
        (badges?'<div style="margin-top:4px">'+badges+'</div>':'') +

function openClient(id) {
  S.wsCid = id;
  S.clientTab = 'profile';
  rClientDetail();
}

function rClientDetail() {
  var c = gc(S.wsCid); if(!c) return;
  var tabs = ['profile','meals','checklist'];
  var tabLbls = {profile:'Food Profile',meals:'This Week',checklist:'Service Checklist'};
  if(S.role==='dietitian') tabs = ['profile','meals','checklist','edit'];
  tabLbls.edit = 'Edit';
  var tabHtml = '<div class="tab-bar">';
  for(var i=0;i<tabs.length;i++){
    tabHtml += '<button class="tab-btn'+(S.clientTab===tabs[i]?' active':'')+'" onclick="S.clientTab=\''+tabs[i]+'\';rClientDetail()">'+tabLbls[tabs[i]]+'</button>';
  }
  tabHtml += '</div>';
  var back = '<button class="btn" style="margin-bottom:1rem" onclick="go(\'clients\')"><i class="ti ti-arrow-left" style="font-size:13px"></i> All clients</button>';
  var content = '';
  if(S.clientTab==='profile') content = rProfile(c);
  else if(S.clientTab==='meals') content = rMeals(c);
  else if(S.clientTab==='checklist') content = rChecklist(c);
  else if(S.clientTab==='edit') content = rEditClient(c);
  $('p-clients').innerHTML = back + '<h2 class="serif" style="font-size:22px;font-weight:400;margin-bottom:4px">'+esc(c.name)+'</h2>' +
    '<div style="font-size:12px;color:var(--warm);margin-bottom:1rem">'+
      (tu(c.chefId)?'Chef: '+tu(c.chefId).name.split(' ')[0]:'Unassigned') +
      (c.serviceDay?' . Service: '+c.serviceDay+'s':'') +
    '</div>' +
    tabHtml + content;
}

function rProfile(c) {
  var lf = c.feedbackHistory && c.feedbackHistory.length ? c.feedbackHistory[0] : null;
  var html = '';
  // Allergies -- red alert
  if(c.allergies && c.allergies.length) {
    html += '<div class="card" style="border-color:var(--red);background:var(--red-l)">' +
      '<div class="card-title" style="color:var(--red-d)"><i class="ti ti-alert-triangle"></i> Allergies -- never use</div>' +
      '<div style="font-size:14px;font-weight:500;color:var(--red-d)">'+c.allergies.join(' . ')+'</div>' +
    '</div>';
  }
  // Dietary
  if(c.dietaryRestrictions && c.dietaryRestrictions.length) {
    html += '<div class="card"><div class="card-title">Dietary restrictions</div>' +
      c.dietaryRestrictions.map(function(d){return '<span class="tag tg">'+esc(d)+'</span>';}).join('') +
    '</div>';
  }
  // Preferences
  html += '<div class="card"><div class="card-title">Food preferences</div>' +
    '<div class="g2">' +
      '<div><div style="font-size:11px;color:var(--warm);margin-bottom:4px">v Loves</div><div style="font-size:13px">'+esc(c.loves||'--')+'</div></div>' +
      '<div><div style="font-size:11px;color:var(--warm);margin-bottom:4px">x Dislikes / hard no\'s</div><div style="font-size:13px">'+esc(c.aversions||'--')+'</div></div>' +
    '</div>' +
    (c.notes?'<div style="font-size:12px;color:var(--warm);margin-top:6px;font-style:italic">'+esc(c.notes)+'</div>':'') +
  '</div>';
  // Family members
  if(c.familyMembers && c.familyMembers.length) {
    html += '<div class="card"><div class="card-title">Family members</div>';
    for(var i=0;i<c.familyMembers.length;i++){
      var m=c.familyMembers[i];
      html += '<div style="padding:6px 0;border-bottom:0.5px solid var(--bdr);font-size:13px">' +
        '<strong>'+esc(m.name)+'</strong>' +
        (m.role==='child'?' <span class="tag" style="font-size:10px">child'+( m.age?', '+m.age:'')+'</span>':'') +
        (m.allergies&&m.allergies.length?' <span class="tag tr2" style="font-size:10px">(!) '+m.allergies.join(', ')+'</span>':'') +
        (m.notes?'<div style="font-size:11px;color:var(--warm);margin-top:2px">'+esc(m.notes)+'</div>':'') +
      '</div>';
    }
    html += '</div>';
  }
  // Latest feedback summary
  if(lf) {
    html += '<div class="card"><div class="card-title">Latest feedback -- week of '+esc(lf.weekOf)+'</div>' +
      '<div style="font-size:14px;font-weight:500;margin-bottom:4px">'+stars(lf.overallRating)+' '+lf.overallRating+'/5</div>' +
      (lf.overallNote?'<div style="font-size:13px;font-style:italic;color:var(--warm-d);margin-bottom:8px">"'+esc(lf.overallNote)+'"</div>':'') +
      '<div class="fb-meals">' +
        (lf.meals||[]).map(function(m){
          return '<span class="tag '+(m.thumbs==='up'?'tg':m.thumbs==='down'?'tr2':'')+'">'+
            (m.thumbs==='up'?'&#x1F44D; ':m.thumbs==='down'?'&#x1F44E; ':'')+esc(m.name)+'</span>';
        }).join('') +
      '</div>' +
    '</div>';
  }
  // Rotation bank
  if(c.rotationBank && c.rotationBank.length) {
    html += '<div class="card"><div class="card-title">Approved rotation (' + c.rotationBank.length + ' meals)</div>' +
      '<div style="display:flex;flex-wrap:wrap;gap:5px">' +
      c.rotationBank.slice(0,10).map(function(r){return '<span class="tag tg">v '+esc(r.name)+'</span>';}).join('') +
      (c.rotationBank.length>10?'<span class="tag">+more</span>':'') +
      '</div></div>';
  }
  // AI shortcut
  html += '<button class="btn bs bfull" style="margin-top:4px" onclick="S.wsCid='+c.id+';go(\'ai\')"><i class="ti ti-robot" style="font-size:13px"></i> Ask AI to plan meals for '+esc(c.name)+'</button>';
  return html;
}

// -- MEALS TAB ----------------------------------------------------------------
function rMeals(c) {
  if(!c.weeklyMeals) c.weeklyMeals = {};
  var html = '<div class="card"><div class="card-title">This week\'s meal plan</div>' +
    '<div class="week-grid">';
  for(var i=0;i<WDAYS.length;i++){
    var day=WDAYS[i];
    var meals=(c.weeklyMeals[day]||[]);
    html += '<div class="day-col"><div class="day-label">'+day+'</div>';
    for(var j=0;j<meals.length;j++){
      var m=meals[j];
      html += '<div class="meal-chip" onclick="editMealM('+c.id+',\''+day+'\','+j+')">' +
        '<span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1;font-size:10px">'+esc(m.name)+'</span>' +
        '<button class="meal-chip-del" onclick="event.stopPropagation();delMeal('+c.id+',\''+day+'\','+j+')">x</button>' +
      '</div>';
    }
    html += '<button class="add-meal-btn" onclick="addMealM('+c.id+',\''+day+'\')"><i class="ti ti-plus" style="font-size:10px"></i> Add</button>';
    html += '</div>';
  }
  html += '</div></div>';
  // Add to rotation
  html += '<div class="card"><div class="card-title">Rotation bank</div>' +
    '<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">' +
    (c.rotationBank||[]).map(function(r,ri){
      return '<span class="tag tg" style="cursor:pointer" onclick="removeRotation('+c.id+','+ri+')">v '+esc(r.name)+' x</span>';
    }).join('') +
    '</div>' +
    '<button class="btn bs" onclick="addRotationM('+c.id+')"><i class="ti ti-plus" style="font-size:11px"></i> Add to rotation</button>' +
  '</div>';
  return html;
}

function addMealM(cid, day) {
  openM('<h3 class="serif">Add meal -- '+day+'</h3>' +
    '<div class="fg"><label>Meal name</label><input id="am-name" placeholder="e.g. Lemon herb chicken"></div>' +
    '<div class="fg"><label>Type</label><select id="am-type">' + MTYPES.map(function(t){return '<option>'+t+'</option>';}).join('') + '</select></div>' +
    '<div class="fg"><label>Notes (optional)</label><input id="am-notes" placeholder="Serving notes, packaging..."></div>' +
    '<button class="btn bd bfull" onclick="saveMeal('+cid+',\''+day+'\')">Add meal</button>' +
    '<button class="mlink" onclick="closeM()">Cancel</button>');
}

function saveMeal(cid, day) {
  var c=gc(cid); if(!c)return;
  var name=$('am-name').value.trim(); if(!name){alert('Enter a meal name');return;}
  if(!c.weeklyMeals)c.weeklyMeals={};
  if(!c.weeklyMeals[day])c.weeklyMeals[day]=[];
  c.weeklyMeals[day].push({id:'m'+Date.now(),name:name,mealType:$('am-type').value,notes:$('am-notes').value});
  saveData(); closeM(); S.clientTab='meals'; rClientDetail();
}

function editMealM(cid, day, idx) {
  var c=gc(cid); if(!c)return;
  var m=(c.weeklyMeals[day]||[])[idx]; if(!m)return;
  openM('<h3 class="serif">Edit meal</h3>' +
    '<div class="fg"><label>Meal name</label><input id="em-name" value="'+esc(m.name)+'"></div>' +
    '<div class="fg"><label>Notes</label><input id="em-notes" value="'+esc(m.notes||'')+'"></div>' +
    '<div style="display:flex;gap:8px;flex-wrap:wrap">' +
      '<button class="btn bd" style="flex:1" onclick="updateMeal('+cid+',\''+day+'\','+idx+')">Save</button>' +
      '<button class="btn bs" style="flex:1" onclick="addToRot('+cid+',\''+day+'\','+idx+')"><i class="ti ti-circle-check"></i> Add to rotation</button>' +
    '</div>' +
    '<button class="btn br bfull" style="margin-top:6px" onclick="delMeal('+cid+',\''+day+'\','+idx+');closeM()">Remove</button>' +
    '<button class="mlink" onclick="closeM()">Cancel</button>');
}

function updateMeal(cid,day,idx){
  var c=gc(cid);if(!c)return;
  var m=(c.weeklyMeals[day]||[])[idx];if(!m)return;
  m.name=$('em-name').value.trim();m.notes=$('em-notes').value;
  saveData();closeM();S.clientTab='meals';rClientDetail();
}

function delMeal(cid,day,idx){
  var c=gc(cid);if(!c)return;
  if(!c.weeklyMeals||!c.weeklyMeals[day])return;
  c.weeklyMeals[day].splice(idx,1);
  saveData();S.clientTab='meals';rClientDetail();
}

function addToRot(cid,day,idx){
  var c=gc(cid);if(!c)return;
  var m=(c.weeklyMeals[day]||[])[idx];if(!m)return;
  if(!c.rotationBank)c.rotationBank=[];
  for(var i=0;i<c.rotationBank.length;i++){if(c.rotationBank[i].name===m.name){alert('Already in rotation.');return;}}
  c.rotationBank.push({name:m.name,stars:0,repeat:'yes',note:''});
  saveData();closeM();S.clientTab='meals';rClientDetail();
}

function addRotationM(cid){
  openM('<h3 class="serif">Add to rotation</h3>' +
    '<div class="fg"><label>Meal name</label><input id="ar-name" placeholder="Client-approved dish"></div>' +
    '<button class="btn bd bfull" onclick="saveRotation('+cid+')">Add</button>' +
    '<button class="mlink" onclick="closeM()">Cancel</button>');
}

function saveRotation(cid){
  var c=gc(cid);if(!c)return;
  var name=$('ar-name').value.trim();if(!name)return;
  if(!c.rotationBank)c.rotationBank=[];
  c.rotationBank.push({name:name,stars:0,repeat:'yes',note:''});
  saveData();closeM();S.clientTab='meals';rClientDetail();
}

function removeRotation(cid,idx){
  var c=gc(cid);if(!c)return;
  if(!confirm('Remove from rotation?'))return;
  c.rotationBank.splice(idx,1);
  saveData();S.clientTab='meals';rClientDetail();
}

var CL_SECTIONS = [
  {s:'Pre-service',items:[
    'Reviewed all allergies -- confirmed no restricted ingredients',
    'All dietary restrictions reviewed',
    'Food preferences and aversions reviewed',
    'Menu confirmed -- no conflicts with client profile',
    'Entry instructions checked (key, code, parking, pets)',

  {s:'During service',items:[

    'Separate cutting boards for proteins and produce',
    'Client\'s spice level followed exactly',
    'All client food preferences respected in every dish',
    'No personal phone calls during active service'
  ]},
  {s:'Kitchen reset & storage',items:[
    'All meals labeled with name, date, and reheating instructions',
    'Food stored neatly and organized',
    'All dishes, pots, pans washed and completely dried',
    'Countertops, stovetop, backsplash, sink fully wiped',
    'Kitchen floor swept',
    'Trash removed -- all the way to outdoor bins'
  ]},
  {s:'Final walk-through',items:[
    'Full walk-through completed before leaving',
    'No personal items left behind',
    'Any damage reported to manager same day'
  ]}

function rChecklist(c) {
  if(!c.checklist) c.checklist = {};
  var html = '';
  for(var si=0;si<CL_SECTIONS.length;si++){
    var sec=CL_SECTIONS[si];
    html += '<div class="card"><div class="card-title">'+sec.s+'</div>';
    for(var ii=0;ii<sec.items.length;ii++){
      var key='s'+si+'i'+ii;
      var checked=c.checklist[key]||false;
      html += '<div style="display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:0.5px solid var(--bdr)">' +
        '<input type="checkbox" '+(checked?'checked':'')+' onchange="toggleCheck('+c.id+',\''+key+'\',this.checked)" style="width:16px;height:16px;accent-color:var(--sage-d);cursor:pointer;flex-shrink:0">' +
        '<span style="font-size:13px;'+(checked?'color:var(--warm);text-decoration:line-through':'')+'">'+esc(sec.items[ii])+'</span>' +
      '</div>';
    }
    html += '</div>';
  }
  html += '<button class="btn br bfull" onclick="clearChecklist('+c.id+')"><i class="ti ti-refresh" style="font-size:12px"></i> Reset checklist</button>';
  return html;
}

function toggleCheck(cid,key,val){
  var c=gc(cid);if(!c)return;
  if(!c.checklist)c.checklist={};
  c.checklist[key]=val;
  saveData();
}

function clearChecklist(cid){
  var c=gc(cid);if(!c)return;
  if(!confirm('Reset all checklist items?'))return;
  c.checklist={};
  saveData();S.clientTab='checklist';rClientDetail();
}

function saveFamilyMember(cid){
  var c=gc(cid);if(!c)return;
  var name=$('fm-name').value.trim();if(!name){alert('Enter a name');return;}
  if(!c.familyMembers)c.familyMembers=[];
  c.familyMembers.push({

function buildProfileWithAI(){
  var desc=document.getElementById('ai-profile-input').value.trim();
  if(!desc){alert('Please describe the family first.');return;}
  var btn=document.getElementById('ai-build-btn');
  if(btn){btn.textContent='Building profile...';btn.disabled=true;}
  var system='You are a profile builder for a private chef service. Extract structured client information from a natural language description and return ONLY valid JSON. No markdown, no code blocks, no extra text. Return this exact structure: {"name":"First Last Initial","serviceDay":"Monday or empty","allergies":[],"dietaryRestrictions":[],"loves":"foods they enjoy","aversions":"foods to avoid","notes":"key context","familyMembers":[{"name":"name","role":"adult or child","age":"age if child","allergies":[],"notes":"notes"}]} Use empty string or empty array if not mentioned.';
  var messages=[{role:'user',content:'Build a client profile from this description: '+desc}];
  fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:system,messages:messages})})
    .then(function(r){return r.json();})
    .then(function(data){
      var parsed=typeof data==='string'?JSON.parse(data):data;
      var reply=(parsed.content&&parsed.content[0])?parsed.content[0].text:'';
      try {
        var clean=reply.replace(/```json/g,'').replace(/```/g,'').trim();
        var profile=JSON.parse(clean);
        var chefId=document.getElementById('ai-nc-chef')?document.getElementById('ai-nc-chef').value:'';
        var newClient={
          id:Date.now(),
          name:profile.name||'New Client',
          serviceDay:profile.serviceDay||'',
          chefId:chefId,
          allergies:profile.allergies||[],
          dietaryRestrictions:profile.dietaryRestrictions||[],
          loves:profile.loves||'',
          aversions:profile.aversions||'',
          notes:profile.notes||'',
          familyMembers:profile.familyMembers||[],
          weeklyMeals:{},
          rotationBank:[],
          feedbackHistory:[],
          checklist:{}
        };
        CLIENTS.push(newClient);
        // Seed AI history with the description so it remembers from day one
        if(!S.aiH[newClient.id])S.aiH[newClient.id]=[];
        S.aiH[newClient.id].push({role:'user',content:'Here is everything I know about this client so far: '+desc,intro:false});
        S.aiH[newClient.id].push({role:'assistant',content:"Got it -- I've built "+newClient.name+"'s profile from what you shared. I'll remember all of this as we plan together. You can keep telling me more at any time and I'll factor it in. What would you like to start with?",intro:true});
        saveData();
        closeM();
        S.wsCid=newClient.id;
        S.clientTab='profile';
        rClientDetail();
      } catch(e) {
        alert('Could not parse the profile. Please try again or add the client manually.');
        if(btn){btn.textContent='Build profile';btn.disabled=false;}
      }
    })
    .catch(function(){
      alert('Connection error. Please try again.');
      if(btn){btn.textContent='Build profile';btn.disabled=false;}
    });
}

function saveFb(cid, source){
  var c=gc(cid);if(!c)return;
  var rating = source==='manual' ? (window._fbRating||0) : (window._fbRatingPublic||0);
  if(!rating){alert('Please select a star rating.');return;}
  var meals=[];
  var mealList = source==='manual' ? (window._fbMeals||[]) : (window._fbMealsPublic||[]);
  var thumbs = source==='manual' ? (window._fbThumbs||{}) : (window._fbThumbsPublic||{});
  for(var i=0;i<mealList.length;i++){
    meals.push({name:mealList[i],thumbs:thumbs[i]||'',again:''});
  }
  var weekRaw = source==='manual' ? ($('mfb-week')?$('mfb-week').value:'') : (window._fbWeekPublic||'');
  var dateObj = weekRaw ? new Date(weekRaw) : new Date();
  var weekOf = dateObj.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  var note = source==='manual' ? ($('mfb-note')?$('mfb-note').value:'') : (window._fbNotePublic||'');
  var next = source==='manual' ? ($('mfb-next')?$('mfb-next').value:'') : (window._fbNextPublic||'');
  if(!c.feedbackHistory)c.feedbackHistory=[];
  c.feedbackHistory.unshift({
    id:'fb'+Date.now(),
    weekOf:weekOf,
    overallRating:rating,
    overallNote:note,
    nextWeek:next,
    meals:meals,
    wantsChanges: note.length>0 || next.length>0,
    source:source
  });
  // Auto update rotation bank based on thumbs
  for(var i=0;i<meals.length;i++){
    if(meals[i].thumbs==='up'){
      if(!c.rotationBank)c.rotationBank=[];
      var found=false;
      for(var j=0;j<c.rotationBank.length;j++){if(c.rotationBank[j].name===meals[i].name){found=true;break;}}
      if(!found)c.rotationBank.push({name:meals[i].name,stars:rating,repeat:'yes',note:'Added from feedback'});
    }
  }
  saveData();
  closeM();
  rFeedback();
}

function buildSP(c){
  var alStr='';
  if(c.allergies&&c.allergies.length){
    for(var i=0;i<c.allergies.length;i++){
      alStr+='\n(!) '+c.allergies[i].toUpperCase()+' -- NEVER suggest anything containing this. Flag immediately with (!) ALLERGY FLAG.';
    }
  }
  var famSum=[];
  var members=c.familyMembers||[];
  for(var i=0;i<members.length;i++){
    var m=members[i];
    famSum.push(m.name+' ('+(m.role==='child'?'child, age '+(m.age||'?'):'adult')+'): allergies='+(m.allergies&&m.allergies.length?m.allergies.join(','):'none')+(m.notes?'. '+m.notes:''));
  }
  var rotM=[];
  if(c.rotationBank){for(var i=0;i<c.rotationBank.length;i++){rotM.push(c.rotationBank[i].name);}}
  var rfb=[];
  if(c.feedbackHistory){
    for(var i=0;i<Math.min(4,c.feedbackHistory.length);i++){
      var fb=c.feedbackHistory[i];
      var mStr=[];var ms=fb.meals||[];
      for(var j=0;j<ms.length;j++){mStr.push(ms[j].name+' '+(ms[j].thumbs==='up'?'(+1)':'ms[j].thumbs==="down"?(-1):--'));}
      rfb.push('Week of '+fb.weekOf+': '+fb.overallRating+'/5. "'+(fb.overallNote||'')+'"'+(fb.nextWeek?' Wants: '+fb.nextWeek:'')+(mStr.length?'. Meals: '+mStr.join(', '):''));
    }
  }
  var curM=[];
  for(var d=0;d<WDAYS.length;d++){
    var day=WDAYS[d];var ms=(c.weeklyMeals||{})[day]||[];
    if(ms.length){var ns=[];for(var j=0;j<ms.length;j++)ns.push(ms[j].name);curM.push(day+': '+ns.join(', '));}
  }
  var chefN=(tu(c.chefId)?tu(c.chefId).name:'Chef').split(' ')[0];
  return 'You are the AI menu planning assistant inside "The Table" -- built for Eddelbuttel Nutrition, owned by Brittany Eddelbuttel, RD.\nYou are helping '+chefN+' plan meals for '+c.name+'.\n\nFAMILY MEMBERS:\n'+(famSum.join('\n')||'Not added yet')+'\n\nALLERGIES -- NON-NEGOTIABLE:'+(alStr||'\nNo known allergies.')+'\n\nPREFERENCES:\nSafe foods / loves: '+(c.loves||'not specified')+'\nAversions / hard nos: '+(c.aversions||'none')+'\nNotes: '+(c.notes||'none')+'\n\nAPPROVED ROTATION MEALS: '+(rotM.join(', ')||'none yet')+'\n\nFEEDBACK HISTORY (most recent first):\n'+(rfb.join('\n')||'No feedback yet -- first week or client has not submitted.')+'\n\nTHIS WEEK\'S CURRENT MENU: '+(curM.join(' | ')||'Nothing planned yet')+'\n\nBEHAVIOR:\n- Speak directly to '+chefN+' the chef.\n- Always reference specific family details and feedback history.\n- The more feedback history exists, the smarter your suggestions should be.\n- If feedback shows a meal was thumbs down, never suggest it again.\n- If a client requests something specific next week, prioritize it.\n- Flag allergens immediately with (!) ALLERGY FLAG.\n- Suggest meals from the rotation bank when appropriate.\n- Be warm, specific, and practical.\n- When suggesting a weekly plan, format it clearly by day.';
}

function buildAIIntro(c){
  var chefN=(tu(c.chefId)?tu(c.chefId).name:'Chef').split(' ')[0];
  var lf=c.feedbackHistory&&c.feedbackHistory.length?c.feedbackHistory[0]:null;
  var topRot=[];
  if(c.rotationBank){for(var i=0;i<c.rotationBank.length;i++){if(topRot.length<3)topRot.push(c.rotationBank[i].name);}}
  var t='Hi '+chefN+'! Ready to plan for **'+c.name+'**.\n\n';
  if(c.allergies&&c.allergies.length) t+='**(!) Allergies:** '+c.allergies.join(', ')+" -- I'll flag anything containing these.\n";
  t+='**Loves:** '+(c.loves||'not specified')+'.\n';
  if(c.aversions) t+='**Aversions:** '+c.aversions+'.\n';
  if(topRot.length) t+='**Top rotation meals:** '+topRot.join(', ')+'.\n';
  if(lf) t+='\n**Last feedback:** *'+lf.overallRating+'/5'+(lf.overallNote?' -- "'+lf.overallNote+'"':'')+(lf.nextWeek?' | Wants next week: '+lf.nextWeek:'');
  if(!lf) t+='\n**No feedback yet** -- working from the intake profile.';
  if(c.feedbackHistory&&c.feedbackHistory.length>3) t+='\n\n*I have '+c.feedbackHistory.length+' weeks of feedback for this family -- my suggestions are based on what\'s worked.*';
  t+='\n\nWhat are you thinking for this week?';
  if(!S.aiH[c.id])S.aiH[c.id]=[];
  S.aiH[c.id]=[{role:'assistant',content:t,intro:true}];
}

function rAI(){

  // Client picker

    picker='<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:1rem">';

      picker+='<button class="btn'+(cl[i].id===c.id?' bs':'')+'" onclick="S.wsCid='+cl[i].id+';rAI()">'+esc(cl[i].name)+'</button>';
    }

    '<strong>'+esc(c.name)+'</strong>' +
    (c.allergies&&c.allergies.length?' . <span style="color:var(--red-d)">(!) '+c.allergies.join(', ')+'</span>':'') +
    (lf?' . Last rating: *'+lf.overallRating+'/5':'') +
    (fbCount>0?' . <span style="color:var(--sage-d)">'+fbCount+' weeks of feedback</span>':'') +
    (lf&&lf.nextWeek?' . <span style="color:var(--blue-d)">Wants: '+esc(lf.nextWeek)+'</span>':'') +
  '</div>';

  var msgs='';var aiHist=S.aiH[c.id]||[];
  for(var i=0;i<aiHist.length;i++){
    var m=aiHist[i];
    msgs+='<div class="aim '+(m.role==='user'?'user':m.flag?'flag':m.intro?'ai intro':'ai')+'">'+

    '</div>';

  // Quick prompts
  var qps=[
    {l:'Plan this week',p:'Suggest a full week of meals for '+c.name+'. Use feedback history and the rotation bank. Format by day.'},
    {l:'What worked best?',p:'Based on feedback history, what has worked best for '+c.name+'? What should I prioritize?'},
    {l:'Kid-friendly ideas',p:'Suggest 5 kid-friendly meal ideas for '+c.name+'. Keep it simple and allergy-safe.'},
    {l:'Check this week',p:'Review this week\'s current menu for '+c.name+'. Flag any allergens, repeats, or gaps.'}
  ];

  for(var i=0;i<qps.length;i++) qpHtml+='<button class="qpb" onclick="qpSend('+c.id+','+i+')">'+qps[i].l+'</button>';
  qpHtml+='</div>';
  $('p-ai')._qps=qps;
  $('p-ai').innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:8px">'+
      '<h2 class="serif" style="font-size:22px;font-weight:400">AI Menu Assistant</h2>'+
      '<button class="btn" onclick="clearAI('+c.id+')" style="font-size:11px;padding:4px 10px"><i class="ti ti-refresh" style="font-size:11px"></i> New chat</button>'+
    '</div>'+
    picker+ctx+

      '<button class="btn bs" onclick="sendAI('+c.id+')" style="align-self:flex-end;padding:9px 14px"><i class="ti ti-arrow-up" style="font-size:14px"></i></button>'+

function clearAI(cid){S.aiH[cid]=[];var c=gc(cid);if(c)buildAIIntro(c);rAI();}
function qpSend(cid,idx){var qps=$('p-ai')._qps;if(!qps||!qps[idx])return;var i=$('aiinp');if(i){i.value=qps[idx].p;sendAI(cid);}}

function sendAI(cid){
  var inp=$('aiinp');var t=inp?inp.value.trim():'';if(!t)return;if(inp)inp.value='';
  var c=gc(cid);if(!c)return;
  if(!S.aiH[c.id])S.aiH[c.id]=[];
  S.aiH[c.id].push({role:'user',content:t});
  saveData();
  var chat=$('aichat');
  if(chat){
    chat.innerHTML+='<div class="aim user">'+t.replace(/\n/g,'<br>')+'</div>';
    var th=document.createElement('div');th.className='aim ai thinking';th.id='aith';
    th.textContent='Thinking about '+c.name+'...';
    chat.appendChild(th);chat.scrollTop=chat.scrollHeight;
  }
  var msgs=[];var hist=S.aiH[c.id];
  for(var i=0;i<hist.length;i++){if(hist[i].role==='user'||hist[i].role==='assistant')msgs.push({role:hist[i].role,content:hist[i].content||''});}
  fetch('/.netlify/functions/ai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({system:buildSP(c),messages:msgs})})
    .then(function(r){return r.json();})
    .then(function(data){
      var parsed=typeof data==='string'?JSON.parse(data):data;
      var reply=(parsed.content&&parsed.content[0])?parsed.content[0].text:'Sorry, could not generate a response.';
      var isFlag=reply.indexOf('(!) ALLERGY FLAG')>=0;
      S.aiH[c.id].push({role:'assistant',content:reply,flag:isFlag});
      saveData();
      var aith=$('aith');if(aith)aith.parentNode.removeChild(aith);
      if(chat){
        var el=document.createElement('div');
        el.className='aim '+(isFlag?'flag':'ai');
        el.innerHTML=reply.replace(/\n/g,'<br>').replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>');
        // Add to menu button
        var meals=parseAIMeals(reply);
        if(meals.length>=2){
          var btn=document.createElement('button');
          btn.className='btn bs';btn.style.marginTop='8px';btn.style.fontSize='12px';
          btn.innerHTML='<i class="ti ti-calendar-plus" style="font-size:11px"></i> Add these meals to plan';
          (function(m,id){btn.onclick=function(){addAIMealsM(id,m);};})(meals,c.id);
          el.appendChild(btn);
        }
        chat.appendChild(el);chat.scrollTop=chat.scrollHeight;
      }
    })
    .catch(function(){
      var aith=$('aith');if(aith)aith.parentNode.removeChild(aith);
      if(chat){var el=document.createElement('div');el.className='aim ai';el.textContent='Connection error -- please try again.';chat.appendChild(el);}
    });
}

function parseAIMeals(text){
  var meals=[];var lines=text.split('\n');
  for(var i=0;i<lines.length;i++){
    var line=lines[i].trim();
    var m=line.match(/^(?:\d+[\.\.\)]|[-*]|\*\*)\s*(.+?)(?:\*\*)?(?:\s*[-:].+)?$/);
    if(m){var name=m[1].replace(/\*\*/g,'').trim();if(name.length>4&&name.length<80&&name.split(' ').length>=2)meals.push({name:name,day:WDAYS[meals.length%7]});}
  }
  return meals;
}

function addAIMealsM(cid,meals){
  var rows='';
  for(var i=0;i<meals.length;i++){
    var dayOpts=WDAYS.map(function(d,j){return '<option value="'+d+'"'+(j===i%7?' selected':'')+'>'+d+'</option>';}).join('');
    rows+='<div style="display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:0.5px solid var(--bdr);flex-wrap:wrap">'+
      '<input type="checkbox" id="aim-cb-'+i+'" checked style="width:16px;height:16px;accent-color:var(--sage-d);flex-shrink:0">'+
      '<input id="aim-n-'+i+'" value="'+esc(meals[i].name)+'" style="flex:1;min-width:140px;padding:5px 8px;border:0.5px solid var(--bdr);border-radius:6px;font-family:Jost,sans-serif;font-size:12px">'+
      '<select id="aim-d-'+i+'" style="padding:5px 8px;border:0.5px solid var(--bdr);border-radius:6px;font-family:Jost,sans-serif;font-size:12px">'+dayOpts+'</select>'+
    '</div>';
  }
  openM('<h3 class="serif">Add meals to weekly plan</h3>'+
    '<p style="font-size:13px;color:var(--warm);margin-bottom:1rem">Uncheck any you don\'t want. Adjust the day if needed.</p>'+
    rows+
    '<button class="btn bd bfull" style="margin-top:1rem" onclick="confirmAddAIMeals('+cid+','+meals.length+')"><i class="ti ti-plus"></i> Add to plan</button>'+
    '<button class="mlink" onclick="closeM()">Cancel</button>');
}

function confirmAddAIMeals(cid,count){
  var c=gc(cid);if(!c)return;
  var added=0;
  for(var i=0;i<count;i++){
    var cb=document.getElementById('aim-cb-'+i);if(!cb||!cb.checked)continue;
    var nameEl=document.getElementById('aim-n-'+i);var dayEl=document.getElementById('aim-d-'+i);
    if(!nameEl||!dayEl)continue;
    var name=nameEl.value.trim();var day=dayEl.value;if(!name)continue;
    if(!c.weeklyMeals)c.weeklyMeals={};
    if(!c.weeklyMeals[day])c.weeklyMeals[day]=[];
    c.weeklyMeals[day].push({id:'m'+Date.now()+i,name:name,mealType:'Dinner',notes:'Added from AI'});
    added++;
  }
  saveData();closeM();
  alert(added+' meal'+(added!==1?'s':'')+' added to the plan!');
}

function rRec(){
  if(S.recEdit!==null&&S.recEdit!==undefined){rRecEditor();return;}
  var filter=S.recFilter||'All';
  var tagFilter=S.recTagFilter||[];
  var list=[];
  for(var i=0;i<RECIPES.length;i++){
    var r=RECIPES[i];
    if(filter!=='All'&&r.mealType!==filter)continue;
    if(tagFilter.length){
      var match=true;
      for(var j=0;j<tagFilter.length;j++){
        var found=false;
        if(r.tags){for(var k=0;k<r.tags.length;k++){if(r.tags[k]===tagFilter[j]){found=true;break;}}}
        if(!found){match=false;break;}
      }
      if(!match)continue;
    }
    list.push({r:r,i:i});
  }
  var mtBtns='';
  ['All','Breakfast','Lunch','Dinner','Snack'].forEach(function(t){
    mtBtns+='<button class="btn'+(filter===t?' bs':'')+'" onclick="S.recFilter=\''+t+'\';S.recEdit=null;rRec()">'+t+'</button>';
  });
  var tagBtns='';
  for(var i=0;i<DIET_TAGS.length;i++){
    var active=tagFilter.indexOf(DIET_TAGS[i])>=0;
    tagBtns+='<button class="rec-tag'+(active?' on':'')+'" onclick="toggleRecTag(\''+DIET_TAGS[i]+'\')">'+DIET_TAGS[i]+'</button>';
  }
  var recHtml='';
  for(var i=0;i<list.length;i++){
    var r=list[i].r;var ri=list[i].i;
    var tagHtml='';if(r.tags){for(var j=0;j<r.tags.length;j++)tagHtml+='<span class="tag tg">'+esc(r.tags[j])+'</span>';}
    recHtml+='<div class="card" style="cursor:pointer" onclick="S.recEdit='+ri+';rRec()">'+
      '<div style="display:flex;justify-content:space-between;align-items:flex-start">'+
        '<div><div style="font-weight:500;font-size:14px">'+esc(r.name)+'</div>'+
        '<div style="font-size:12px;color:var(--warm)">Serves '+(r.servings||'')+(r.prepTime?' . Prep '+r.prepTime:'')+'</div></div>'+
        '<div>'+mtb(r.mealType||'Dinner')+tagHtml+'</div>'+
      '</div>'+
    '</div>';
  }
  $('p-recipes').innerHTML=
    '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem">'+
      '<h2 class="serif" style="font-size:22px;font-weight:400">Recipe Bank</h2>'+
      '<button class="btn bs" onclick="newRec()"><i class="ti ti-plus" style="font-size:13px"></i> Add recipe</button>'+
    '</div>'+
    '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px">'+mtBtns+'</div>'+
    '<div style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:1rem">'+tagBtns+'</div>'+
    (list.length?recHtml:'<div class="empty">No recipes yet. Add the first one!</div>');
}

function toggleRecTag(t){
  if(!S.recTagFilter)S.recTagFilter=[];
  var idx=S.recTagFilter.indexOf(t);
  if(idx>=0)S.recTagFilter.splice(idx,1);else S.recTagFilter.push(t);
  S.recEdit=null;rRec();
}

        '<button class="btn bs" onclick="saveRecVer()"><i class="ti ti-device-floppy"></i> Save version</button>'+
        '<button class="btn br" onclick="delRec()"><i class="ti ti-trash"></i> Delete</button>'+
      '</div>'+
    '</div>'+
    '<div class="card"><div class="card-title">Version history</div>'+versHtml+'</div>';
}

function toggleRecEdTag(t){
  var r=RECIPES[S.recEdit];if(!r)return;
  if(!r.tags)r.tags=[];
  var idx=r.tags.indexOf(t);if(idx>=0)r.tags.splice(idx,1);else r.tags.push(t);
  rRecEditor();
}

function saveRecVer(){
  var r=RECIPES[S.recEdit];if(!r)return;
  var n=prompt('Note for this version:','Updated');if(!n)return;
  if(!r.versions)r.versions=[];
  r.versions.push({date:tod(),note:n});
  saveData();rRecEditor();
}

function delRec(){
  if(!confirm('Delete this recipe?'))return;
  RECIPES.splice(S.recEdit,1);S.recEdit=null;saveData();rRec();
}

      '</select>' +
    '</div>' +
    '<button class="btn bd bfull" onclick="saveNewTeam()">Add member</button>' +
    '<button class="mlink" onclick="closeM()">Cancel</button>');
}

function saveNewTeam() {
  var name=$('tm-name').value.trim();
  var email=$('tm-email').value.trim().toLowerCase();
  var pw=$('tm-pw').value;
  var role=$('tm-role').value;
  if(!name||!email){alert('Name and email are required.');return;}
  for(var i=0;i<TEAM.length;i++){if(TEAM[i].email===email){alert('That email is already in the system.');return;}}
  TEAM.push({id:'u'+Date.now(),name:name,role:role,email:email,password:pw||'changeme',color:TCOLORS[TEAM.length%TCOLORS.length]});
  saveData();closeM();rTeam();
}

function editTeamM(id) {
  var u=null;for(var i=0;i<TEAM.length;i++){if(TEAM[i].id===id){u=TEAM[i];break;}}if(!u)return;
  openM('<h3 class="serif">Edit -- '+esc(u.name)+'</h3>' +
    '<div class="fg"><label>Full name</label><input id="et-name" value="'+esc(u.name)+'"></div>' +
    '<div class="fg"><label>Email</label><input id="et-email" value="'+esc(u.email||'')+'"></div>' +
    '<div class="fg"><label>New password <span style="font-weight:300">(leave blank to keep)</span></label><input id="et-pw" type="password" placeholder="Leave blank to keep"></div>' +
    '<div class="fg"><label>Role</label>' +
      '<select id="et-role">' +
        '<option value="chef"'+(u.role==='chef'?' selected':'')+'>Chef</option>' +
        '<option value="manager"'+(u.role==='manager'?' selected':'')+'>Client Experience Manager</option>' +
        '<option value="dietitian"'+(u.role==='dietitian'?' selected':'')+'>Dietitian</option>' +
      '</select>' +
    '</div>' +
    '<button class="btn bd bfull" onclick="saveEditTeam(\''+id+'\')">Save</button>' +
    '<button class="mlink" onclick="closeM()">Cancel</button>');
}

function saveEditTeam(id) {
  var u=null;for(var i=0;i<TEAM.length;i++){if(TEAM[i].id===id){u=TEAM[i];break;}}if(!u)return;
  u.name=$('et-name').value.trim();
  u.email=$('et-email').value.trim().toLowerCase();
  u.role=$('et-role').value;
  var pw=$('et-pw').value;if(pw)u.password=pw;
  saveData();closeM();rTeam();
}

function removeTeamM(id) {
  var u=null;for(var i=0;i<TEAM.length;i++){if(TEAM[i].id===id){u=TEAM[i];break;}}if(!u)return;
  var assigned=CLIENTS.filter(function(c){return c.chefId===id;});
  var msg='Remove '+u.name+'?';
  if(assigned.length) msg+=' They are assigned to '+assigned.length+' client'+(assigned.length!==1?'s':'')+'. Those clients will become unassigned.';
  if(!confirm(msg))return;
  TEAM=TEAM.filter(function(t){return t.id!==id;});
  saveData();rTeam();
}

// -- MODAL --------------------------------------------------------------------
function openM(html){$('mbox').innerHTML=html;$('mov').classList.add('open');}
function closeM(){$('mov').classList.remove('open');}
$('mov').addEventListener('click',function(e){if(e.target===this)closeM();});
</script>

<script>
// Prevent iOS rubber band scrolling on the app shell
document.addEventListener('touchmove', function(e) {
  var el = e.target;
  // Allow scrolling inside scrollable elements
  while (el && el !== document.body) {
    var style = window.getComputedStyle(el);
    var overflow = style.overflow + style.overflowY;
    if (overflow.indexOf('scroll') > -1 || overflow.indexOf('auto') > -1) {
      return; // let it scroll
    }
    el = el.parentElement;
  }
  e.preventDefault(); // block everything else
}, { passive: false });

// Prevent double-tap zoom
var lastTap = 0;
document.addEventListener('touchend', function(e) {
  var now = Date.now();
  if (now - lastTap < 300) {
    e.preventDefault();
  }
  lastTap = now;
}, { passive: false });

// Prevent pull-to-refresh
document.body.addEventListener('touchstart', function(e) {
  if (e.touches.length > 1) e.preventDefault();
}, { passive: false });
</script>
